name: Multi-Arch Sync 3x-ui Image

on:
  workflow_dispatch: # 手动触发

permissions:
  contents: read
  packages: write

jobs:
  sync-image:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Multi-Arch Image
        run: |
          # 1. 将你的用户名转换为符合 Docker 规范的小写字母
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          docker buildx imagetools create \
            --tag ghcr.io/${IMAGE_OWNER}/panel:2.9.4 \
            --tag ghcr.io/${IMAGE_OWNER}/panel:v2.9.4 \
            ghcr.io/mhsanaei/3x-ui:v2.9.4
